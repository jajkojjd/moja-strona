<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel sterowania — jabajbaj2137</title>
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <main class="admin-shell">
    <header>
      <p class="eyebrow">xkarolx.pl</p>
      <h1>Panel sterowania</h1>
      <p class="intro">Zmiany zapisane tutaj dotyczą wszystkich odwiedzających stronę.</p>
    </header>
    <section class="settings-card" aria-labelledby="gate-heading">
      <h2 id="gate-heading">Ręczna weryfikacja wejścia</h2>
      <label class="setting-row">
        <span><strong>Wymagaj kliknięcia potwierdzenia</strong><small>Po wyłączeniu strona główna otworzy się bez ekranu weryfikacji.</small></span>
        <input id="gate-enabled" type="checkbox" checked>
      </label>
    </section>
    <section class="settings-card" aria-labelledby="buttons-heading">
      <h2 id="buttons-heading">Przyciski na stronie</h2>
      <p class="hint">Wyłączony przycisk pozostanie widoczny, ale nie otworzy linku.</p>
      <label class="setting-row"><span><strong>Nexil.jpg</strong></span><input type="checkbox" data-button="nexil" checked></label>
      <label class="setting-row"><span><strong>Random strona</strong></span><input type="checkbox" data-button="random" checked></label>
      <label class="setting-row"><span><strong>Mój Discord</strong></span><input type="checkbox" data-button="discord" checked></label>
      <label class="setting-row"><span><strong>TikTok</strong></span><input type="checkbox" data-button="tiktok" checked></label>
      <label class="setting-row"><span><strong>YouTube</strong></span><input type="checkbox" data-button="youtube" checked></label>
      <label class="setting-row"><span><strong>Zgłaszanie błędów</strong></span><input type="checkbox" data-button="report" checked></label>
    </section>
    <section class="save-card">
      <label for="admin-password">Hasło administratora</label>
      <input id="admin-password" type="password" autocomplete="current-password" placeholder="Hasło ustawione w Vercel jako ADMIN_PASSWORD">
      <button id="save-settings" type="button">Zapisz ustawienia</button>
      <p id="save-status" role="status" aria-live="polite"></p>
    </section>
    <a class="back-link" href="/">← Wróć na stronę</a>
  </main>
</body>
</html>
